<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clarity - Blocklist</title>
	<link rel="stylesheet" href="style.css">
</head>

<body class="options-page">
	<div class="card">
		<div class="header">
			<img src="../utils/star.png" alt="star icon">
			<h2>Blocklist</h2>
		</div>

		<form action="" method="get" class="website_form">
			<input type="text" name="website" id="inputSite" placeholder="e.g. reddit.com" required />
			<input type="submit" value="Block" />
		</form>

		<ul id="siteList"></ul>
	</div>

	<script src="blocklist.js"></script>
</body>

</html>
